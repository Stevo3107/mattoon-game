*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b1f27;color:#1d222b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(160px,1fr) auto;grid-template-columns:100%;grid-template-areas:"top" "job" "scene" "panel";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#f3efe6}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#1c2b50;color:#f4f1ea}
.stat{display:flex;flex-direction:column;line-height:1.05;min-width:64px}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}.stat small{font-size:11px;opacity:.75}
.stat b.neg{color:#ff8a7a}
.tb{margin-left:auto;min-width:46px;height:40px;border:0;border-radius:10px;background:#ea7424;color:#fff;font-weight:700;font-size:16px}
#menuBtn{margin-left:0;background:#33467a}
#restartBtn{margin-left:0;background:#33467a;font-size:22px;min-width:42px;padding:0}
#jobbar{grid-area:job;padding:6px 10px;background:#fff8e8;border-bottom:1px solid #d9cfb8;font-size:14px;line-height:1.25}
#jobText b{color:#7a3426}#jobStatus{font-size:12.5px;color:#5a5f68;margin-top:2px}
#jobStatus.ok{color:#17733a;font-weight:700}
#scenewrap{grid-area:scene;position:relative;overflow:hidden;min-height:0;background:#9fb16a}
#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#mapwrap{position:absolute;left:6px;top:6px;width:min(42%,190px);height:74px;overflow:hidden;border-radius:10px;border:2px solid rgba(28,43,80,.7);box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:3;background:#efe9db}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#mapBtns{position:absolute;right:6px;top:6px;display:none;flex-direction:column;gap:6px}
#mapBtns button{width:42px;height:42px;border-radius:10px;border:1px solid #b9b2a2;background:rgba(255,255,255,.92);font-size:20px;font-weight:700;color:#1c2b50}
#mapBtns #mapClose{background:#1c2b50;color:#fff;border-color:#1c2b50}
#mapTitle{display:none;position:absolute;left:58px;right:56px;top:10px;font-size:12px;color:#5a5f68;text-align:center;pointer-events:none}
body.mapopen #mapwrap{left:0;top:0;width:100%;height:100%;border:0;border-radius:0;z-index:6}
body.mapopen #mapBtns{display:flex}body.mapopen #mapTitle{display:block}
#sceneBtns{position:absolute;right:6px;top:6px;display:flex;flex-direction:row;gap:6px;z-index:4}
#sceneBtns button{width:44px;height:42px;border-radius:10px;border:1px solid rgba(28,43,80,.35);background:rgba(255,255,255,.9);font-size:20px;font-weight:700;color:#1c2b50}
#sceneBtns #mapBtn{font-size:14px;background:#1c2b50;color:#fff}
#sceneBtns #tagsBtn,#sceneBtns #spotsBtn{font-size:12px;letter-spacing:.3px}
#sceneBtns #dayBtn{font-size:10px;line-height:1.05;letter-spacing:.3px;font-weight:800}
#sceneBtns #spotsBtn.on{background:#b3261e;color:#fff;border-color:#b3261e}
#sceneBtns #tagsBtn.on{background:#1c2b50;color:#fff;border-color:#1c2b50}
#toast{position:absolute;left:8px;right:58px;top:88px;pointer-events:none;display:flex;flex-direction:column;gap:4px;z-index:8}
body.mapopen #toast{top:46px}
#toast div{background:rgba(28,43,80,.94);color:#fff;padding:7px 10px;border-radius:9px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:opacity .4s}
#toast div.bad{background:rgba(160,40,30,.95)}#toast div.good{background:rgba(23,115,58,.95)}
#panel{grid-area:panel;padding:5px 8px 6px;background:#e9e3d6;display:flex;flex-direction:column;gap:5px;overflow:auto;border-top:1px solid #c9c0ad}
.row{display:flex;align-items:center;gap:8px}
.row>label{width:74px;font-size:13px;font-weight:600;color:#3a3f48;flex:none}
.row.top{gap:8px}
#speedo{display:flex;align-items:baseline;gap:3px;min-width:84px;background:#1d222b;color:#ffd27a;border-radius:10px;padding:4px 8px;height:46px}

<script>// ---------------------------------------------------------------- NI&I town loader (Oct 30): shared core + one town at a time.
// index.html shows the loading screen, loads core.js (engine + shared art), then the current town's pack from towns/.
// Moving to another town saves, shows the travel screen and reloads the page, so the last town's art is fully released.
(function () {
'use strict';
const TOWNS = { // the one place for town names, packs and rail miles between them
  mattoon: { name: 'Mattoon', pack: 'towns/mattoon.js', south: 'neoga', southMi: 11.5 },
  neoga: { name: 'Neoga', pack: 'towns/neoga.js', north: 'mattoon', northMi: 11.5 },
};
const RUN_MPH = 25;                      // road speed between towns
const KEY = 'nii-towns-v10', OLD_KEY = 'nii-mattoon-test-v9';
const $ = id => document.getElementById(id);
let ENV = null;
function env() {
  if (ENV) return ENV;
  try { ENV = JSON.parse(localStorage.getItem(KEY)); } catch (e) { ENV = null; }
  if (!ENV || ENV.v !== 10) { ENV = { v: 10, town: 'mattoon', towns: {} }; // first run on v10: carry the v9 save over untouched (the v9 key is left in place)
    try { const o = JSON.parse(localStorage.getItem(OLD_KEY)); if (o && o.veh && o.cons) { ENV.towns.mattoon = o; ENV.fromV9 = true; } } catch (e) { } }
  if (!TOWNS[ENV.town]) ENV.town = 'mattoon';
  return ENV;
}
// ---- Look around (Nov 1): a view-only visit to another town. The flag lives in sessionStorage, never in the save; during a visit nothing is written.
const VKEY = 'nii-visit', XKEY = 'nii-visit-cross';
let VISIT = null; try { const v = JSON.parse(sessionStorage.getItem(VKEY) || 'null'); if (v && TOWNS[v.town]) VISIT = v; } catch (e) { }
function write() { if (VISIT) return; try { localStorage.setItem(KEY, JSON.stringify(ENV)); } catch (e) { } }
function runInfo(from, to) { const T = TOWNS[from], mi = T.south === to ? T.southMi : T.northMi, sec = Math.round(mi / RUN_MPH * 3600); return { mi, mph: RUN_MPH, sec, min: Math.round(sec / 60) }; }
// ---- loading screen
let prog = 0, progTo = 0, progAnim = null;
function setProg(p, ms) { progTo = p; const p0 = prog, t0 = performance.now(); cancelAnimationFrame(progAnim);
  const step = t => { const k = Math.min(1, (t - t0) / (ms || 1)); prog = p0 + (progTo - p0) * k; const b = $('ldBar'), tr = $('ldTrain'); if (b) b.style.width = (prog * 100).toFixed(1) + '%'; if (tr) tr.style.left = `calc(${(prog * 100).toFixed(1)}% - 34px)`; if (k < 1) progAnim = requestAnimationFrame(step); };
  progAnim = requestAnimationFrame(step); }
function showLoading(title, sub, info) { const L = $('loading'); L.classList.add('show'); $('ldTitle').textContent = title; $('ldSub').textContent = sub || ''; $('ldInfo').textContent = info || ''; }
function hideLoading() { setProg(1, 250); setTimeout(() => $('loading').classList.remove('show'), 320); }
function fail(msg) { $('ldSub').textContent = ''; $('ldInfo').innerHTML = msg; $('loading').classList.add('fail'); }
const travelText = (from, to) => { const r = runInfo(from, to); return `${TOWNS[from].name} to ${TOWNS[to].name}: ${r.mi} mi at ${r.mph} mph, ${r.min} min`; };
function travel(from, to, train) { if (VISIT) return; const e = env(), mt = e.towns.mattoon; e.town = to; e.trainIn = train; e.travel = { from, to };
  if (from === 'mattoon') e.time = mt.time; else e.time = (e.time || mt.time) + runInfo(from, to).sec;
  write(); showLoading(TOWNS[to].name, `NI&I - next stop ${TOWNS[to].name}`, travelText(from, to)); prog = 0; setProg(0.6, 1600);
  setTimeout(() => location.reload(), 1700); }
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src + (window.NII_BUILD ? '?v=' + NII_BUILD : ''); s.onload = ok; s.onerror = () => no(new Error(src)); document.head.appendChild(s); }); }
// ---- Full screen (Nov 1): Menu entry in both towns and in visit mode. Canvases pick the new size up on fullscreenchange (a resize event is sent too).
const FS = { el: () => document.fullscreenElement || document.webkitFullscreenElement, on() { return !!FS.el(); }, label() { return FS.on() ? 'Exit full screen' : 'Full screen'; },
  toggle() { const d = document.documentElement; try { if (FS.on()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      const p = (d.requestFullscreen || d.webkitRequestFullscreen).call(d, { navigationUI: 'hide' }); const lock = () => { try { if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => { }); } catch (e) { } };
      if (p && p.then) p.then(lock).catch(() => { }); else lock(); } catch (e) { } } };
for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, () => { setTimeout(() => window.dispatchEvent(new Event('resize')), 60); document.querySelectorAll('[data-fs]').forEach(b => b.textContent = FS.label()); });
// shared Menu (Neoga + visit mode); Mattoon's own Menu carries the same entries
function sharedMenu() { const m = document.getElementById('modal'), bg = document.getElementById('modalBg'); if (!m || !bg) return;
  m.innerHTML = `<h2>Menu</h2><div class="btns"><button data-nm="fs" data-fs>${FS.label()}</button><button data-nm="ind" class="alt">Industries</button></div><div class="btns">${VISIT ? '' : '<button data-nm="towns" class="alt">Look at another town</button>'}<button data-nm="close">Back to game</button></div>`; bg.classList.add('show'); }
