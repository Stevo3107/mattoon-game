*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b1f27;color:#1d222b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(160px,1fr) auto;grid-template-columns:100%;grid-template-areas:"top" "job" "scene" "panel";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#f3efe6}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#1c2b50;color:#f4f1ea}
.stat{display:flex;flex-direction:column;line-height:1.05;min-width:64px}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}.stat small{font-size:11px;opacity:.75}
.stat b.neg{color:#ff8a7a}
.tb{margin-left:auto;min-width:46px;height:40px;border:0;border-radius:10px;background:#ea7424;color:#fff;font-weight:700;font-size:16px}
#menuBtn{margin-left:0;background:#33467a}
#restartBtn{margin-left:0;background:#33467a;font-size:22px;min-width:42px;padding:0}
#jobbar{grid-area:job;padding:6px 10px;background:#fff8e8;border-bottom:1px solid #d9cfb8;font-size:14px;line-height:1.25}
#jobText b{color:#7a3426}#jobStatus{font-size:12.5px;color:#5a5f68;margin-top:2px}
#jobStatus.ok{color:#17733a;font-weight:700}
#scenewrap{grid-area:scene;position:relative;overflow:hidden;min-height:0;background:#9fb16a}
#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#mapwrap{position:absolute;left:6px;top:6px;width:min(42%,190px);height:74px;overflow:hidden;border-radius:10px;border:2px solid rgba(28,43,80,.7);box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:3;background:#efe9db}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#mapBtns{position:absolute;right:6px;top:6px;display:none;flex-direction:column;gap:6px}
#mapBtns button{width:42px;height:42px;border-radius:10px;border:1px solid #b9b2a2;background:rgba(255,255,255,.92);font-size:20px;font-weight:700;color:#1c2b50}
#mapBtns #mapClose{background:#1c2b50;color:#fff;border-color:#1c2b50}
#mapTitle{display:none;position:absolute;left:58px;right:56px;top:10px;font-size:12px;color:#5a5f68;text-align:center;pointer-events:none}
body.mapopen #mapwrap{left:0;top:0;width:100%;height:100%;border:0;border-radius:0;z-index:6}
body.mapopen #mapBtns{display:flex}body.mapopen #mapTitle{display:block}
#sceneBtns{position:absolute;right:6px;top:6px;display:flex;flex-direction:row;gap:6px;z-index:4}
#sceneBtns button{width:44px;height:42px;border-radius:10px;border:1px solid rgba(28,43,80,.35);background:rgba(255,255,255,.9);font-size:20px;font-weight:700;color:#1c2b50}
#sceneBtns #mapBtn{font-size:14px;background:#1c2b50;color:#fff}
#sceneBtns #tagsBtn,#sceneBtns #spotsBtn{font-size:12px;letter-spacing:.3px}
#sceneBtns #dayBtn{font-size:10px;line-height:1.05;letter-spacing:.3px;font-weight:800}
#sceneBtns #spotsBtn.on{background:#b3261e;color:#fff;border-color:#b3261e}
#sceneBtns #tagsBtn.on{background:#1c2b50;color:#fff;border-color:#1c2b50}
#toast{position:absolute;left:8px;right:58px;top:88px;pointer-events:none;display:flex;flex-direction:column;gap:4px;z-index:8}
body.mapopen #toast{top:46px}
#toast div{background:rgba(28,43,80,.94);color:#fff;padding:7px 10px;border-radius:9px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:opacity .4s}
#toast div.bad{background:rgba(160,40,30,.95)}#toast div.good{background:rgba(23,115,58,.95)}
#panel{grid-area:panel;padding:5px 8px 6px;background:#e9e3d6;display:flex;flex-direction:column;gap:5px;overflow:auto;border-top:1px solid #c9c0ad}
.row{display:flex;align-items:center;gap:8px}
.row>label{width:74px;font-size:13px;font-weight:600;color:#3a3f48;flex:none}
.row.top{gap:8px}
#speedo{display:flex;align-items:baseline;gap:3px;min-width:84px;background:#1d222b;color:#ffd27a;border-radius:10px;padding:4px 8px;height:46px}
#speedo b{font-size:24px;font-variant-numeric:tabular-nums}#speedo small{color:#c9c2b0;font-size:11px}
#speedo.fast b{color:#ff6a55}#dirArrow{color:#fff;font-size:13px;margin-left:2px}
.gauges{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.gauge{display:flex;align-items:center;gap:5px;font-size:12px}
.gauge span{width:30px;font-weight:600}.gauge em{font-style:normal;width:auto;min-width:0;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px}
.bar{flex:1;min-width:36px;height:12px;border-radius:6px;background:#cfc7b6;overflow:hidden;border:1px solid #b4ab97}
.bar i{display:block;height:100%;width:50%;background:#2f7d4a;transition:width .3s}
.bar i.low{background:#d0821b}.bar i.empty{background:#b3261e}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1px solid #8f8774;flex:1}
.seg button{flex:1;height:46px;border:0;border-right:1px solid #8f8774;background:#fbf8f1;font-weight:700;font-size:16px;padding:0 4px}
.seg button:last-child{border-right:0}
.seg button.on{background:#1c2b50;color:#fff}
.seg.mode{flex:none}.seg.mode button{width:54px;font-size:14px}
.seg.brk button.on{background:#a0281e}.seg.brk button{font-size:14px;padding:0 2px}
.thr{flex:1;display:flex;gap:6px;align-items:center}
.thr button{height:46px;min-width:50px;border-radius:10px;border:1px solid #8f8774;background:#fbf8f1;font-weight:800;font-size:22px}
#thrIdle{flex:1;padding:0;border:0!important;background:#1d222b!important;overflow:hidden}
.thr b{display:block;text-align:center;font-size:17px;color:#9cf09a;font-variant-numeric:tabular-nums;white-space:nowrap}
#controls{display:flex;flex-direction:column;gap:5px}
#drive{display:grid;grid-template-columns:138px 1fr 72px;grid-template-areas:"rev thr thr" "brk brk sand";gap:3px 8px}
.grp{display:flex;flex-direction:column;gap:1px;min-width:0}.grp>small{font-size:10.5px;font-weight:600;color:#5a5f68;line-height:1.1;padding-left:2px;white-space:nowrap}
.g-rev{grid-area:rev}.g-thr{grid-area:thr}.g-brk{grid-area:brk}.g-sand{grid-area:sand}
.g-rev .seg button{width:auto}.g-brk{min-width:0}.g-sand .act{min-width:0;width:100%}
#drawerBtn{flex:none;width:40px;height:46px;border-radius:10px;border:1px solid #8f8774;background:#fbf8f1;font-size:18px;color:#1c2b50}
body.drawer #controls{display:none}body.drawer #drawerBtn{transform:rotate(180deg)}
#actions:not(:has(.act:not(.hide))){display:none}
#tap{display:none;flex-direction:row;gap:8px;align-items:center}#tap .big{flex:none;width:120px}
#tap p{margin:0;font-size:13.5px;line-height:1.3;color:#333}
.big{height:52px;border-radius:12px;border:0;font-weight:800;font-size:18px;letter-spacing:.5px}
.danger{background:#b3261e;color:#fff}
.actions{flex-wrap:wrap}
.act{flex:1;min-width:90px;height:46px;border-radius:10px;border:1px solid #8f8774;background:#fbf8f1;font-weight:700;font-size:14px;padding:0 6px}
.act.on{background:#d9a441;border-color:#8a6416}
.act.fuel{background:#2f7d4a;color:#fff;border-color:#1e5532}
.hide{display:none!important}
#warn{font-size:13px;font-weight:700;color:#a0281e;min-height:0}
#warn:empty{display:none}
body.tapmode #drive{display:none}body.tapmode #tap{display:flex}
#modalBg{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modalBg.show{display:flex}
#modal{background:#fffdf7;border-radius:16px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:16px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.4);font-size:15px;line-height:1.4}
#modal h2{margin:0 0 8px;font-size:20px;color:#1c2b50}
#modal p{margin:6px 0}#modal ul{margin:6px 0;padding-left:20px}#modal li{margin:3px 0}
#modal .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#modal .btns button{flex:1;min-width:120px;height:48px;border-radius:12px;border:0;background:#1c2b50;color:#fff;font-weight:700;font-size:16px}
#modal .btns button.alt{background:#d9d2c2;color:#1d222b}
#modal .btns button.red{background:#b3261e}
.pay{font-size:26px;font-weight:800;color:#17733a}
@media (orientation:landscape) and (max-height:620px){
  .gauge em{min-width:0;font-size:10.5px}.gauge span{width:auto}.bar{min-width:22px}#speedo{padding-left:6px;padding-right:6px;min-width:70px}#speedo b{font-size:21px}
  #app{grid-template-columns:1fr 300px;grid-template-rows:auto auto 1fr;grid-template-areas:"top top" "scene job" "scene panel"}
  #panel{border-left:1px solid #c9c0ad;border-top:0}
  #jobbar{font-size:12.5px;padding:4px 8px;border-left:1px solid #c9c0ad}
  .seg button,.thr button,.act,#drawerBtn{height:42px}
  #speedo{height:42px}.seg.mode button{width:52px}
  #drive{grid-template-columns:138px 1fr 62px;grid-template-areas:"rev thr thr" "brk brk sand";gap:2px 8px}
  .g-rev .seg button{width:auto}.g-sand .act{font-size:13px;padding:0 2px}
  #drawerBtn{display:none}body.drawer #controls{display:flex}
  .seg.mode button{width:46px;font-size:13px}.thr button{min-width:40px}
  .grp>small{font-size:10px}
  #tap{flex-direction:column;align-items:stretch}#tap .big{width:auto}
}
@media (max-width:370px){#top{gap:4px;padding:6px}.stat{min-width:0;margin-right:4px}.tb,#restartBtn{min-width:40px}#speedo{min-width:72px}#speedo b{font-size:21px}.seg.mode button{width:48px;font-size:13px}#drawerBtn{width:40px}.gauge em{font-size:10.5px}.gauge span{width:27px;font-size:11px}}

#sceneBtns #uncBtn{font-size:9px;line-height:1.05;letter-spacing:.2px;font-weight:800}
#sceneBtns #uncBtn.on{background:#b3261e;color:#fff;border-color:#7d1a14;box-shadow:0 0 0 3px rgba(179,38,30,.35)}

#jobbar{cursor:pointer}
#modal .repline{margin:4px 0}
#modal .repbar{height:12px;border-radius:6px;background:#e4dfd3;overflow:hidden;margin:0 0 10px}
#modal .repbar>div{height:100%;background:#17733a}
#modal ul.tasks{list-style:none;padding:0;margin:0 0 6px}
#modal li.task{display:flex;gap:8px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid #e4dfd3;font-size:14px;cursor:pointer}
#modal li.task.done{opacity:.55;cursor:default}
#modal li.task.sel{background:#fff6d6}
#modal li.task .tt{flex:1}
#modal li.task .tr{font-size:12px;color:#17733a;font-weight:700;white-space:nowrap}

.wbcard{position:relative;width:360px;height:220px;transform-origin:0 0;font:10px 'Courier New','DejaVu Sans Mono',monospace;color:#2a2a2a}.wbcard>img{position:absolute;left:0;top:0}.wbcard span{position:absolute;height:14px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:clip;text-transform:uppercase;letter-spacing:.2px}.wbcard .stamp{position:absolute;left:262px;top:36px}
.wbcss{background:#f3ead2;border:1px solid #b23;padding:8px;font:12px 'Courier New',monospace}.wbcss small{color:#b23;font-size:9px;text-transform:uppercase}
.wblist{list-style:none;padding:0!important}.wblist li{margin:2px 0}.wbrow{width:100%;text-align:left;font-size:13px;padding:6px 8px}

/* loading / travel screen (towns, Oct 30) */
#loading{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:#1c2b50 linear-gradient(#1c2b50,#33467a);background-size:cover;background-position:center;color:#f4f1ea}
#loading.show{display:flex}
#loading.pic .ldBox{background:rgba(28,43,80,.82)}
.ldBox{width:100%;min-height:25%;padding:14px 20px calc(18px + env(safe-area-inset-bottom));text-align:center}
#ldTitle{font-size:30px;font-weight:800;letter-spacing:.5px}
#ldSub{font-size:15px;color:#ea7424;font-weight:700;margin-top:2px}
.ldTrack{position:relative;height:34px;margin:12px auto 6px;max-width:520px;border-bottom:4px solid #8a8f99}
.ldTrack i{position:absolute;left:0;bottom:-4px;height:4px;width:0;background:#ea7424}
#ldTrain{position:absolute;bottom:0;left:-34px;font-size:28px;line-height:1;transform:scaleX(-1)}
#ldInfo{font-size:13px;opacity:.9}#ldInfo a{color:#ffd29a}
#loading.fail #ldInfo{font-size:15px;color:#ffd0c8}
#neogaBar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;background:#fff8e8;border-top:1px solid #d9cfb8;font-size:14px}
#neogaBar button{border:0;border-radius:10px;background:#ea7424;color:#fff;font-weight:700;padding:12px 14px;font-size:15px;white-space:nowrap}
</style>
</head>
<body>
<div id="loading" class="show"><div class="ldBox"><div id="ldTitle">Mattoon</div><div id="ldSub"></div><div class="ldTrack"><i id="ldBar"></i><span id="ldTrain">🚂</span></div><div id="ldInfo"></div></div></div>
<div id="app">
  <header id="top">
    <div class="stat"><b id="cash">$0</b><small>Cash</small></div>
    <div class="stat"><b id="rep">0</b><small>Reputation</small></div>
    <div class="stat"><b id="clock">6:00</b><small id="day">Day 1</small></div>
    <button id="speedBtn" class="tb" title="Game speed">1x</button>
    <button id="restartBtn" class="tb" title="Restart from the beginning" aria-label="Restart from the beginning">&#8634;</button>
    <button id="menuBtn" class="tb" title="Menu">&#9776;</button>
  </header>
  <div id="jobbar" data-act="tasks" role="button" aria-label="Today's jobs"><div id="jobText"></div><div id="jobStatus"></div></div>
  <div id="scenewrap">
    <canvas id="scene"></canvas>
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div id="mapBtns">
        <button id="mapClose" aria-label="Close map">&#10005;</button>
        <button data-z="in" aria-label="Zoom in">+</button>
        <button data-z="out" aria-label="Zoom out">&minus;</button>
        <button data-z="fit" aria-label="Fit yard">&#9635;</button>
        <button data-z="loco" aria-label="Find engine">&#9673;</button>
      </div>
      <div id="mapTitle">Yard map: tap a track to send the engine, tap a marker to throw a switch</div>
    </div>
    <div id="sceneBtns">
      <button id="mapBtn" aria-label="Yard map">Map</button>
      <button id="followBtn" aria-label="Follow engine">&#9673;</button>
      <button id="tagsBtn" aria-label="Show destination tags on cars" aria-pressed="false">TAGS</button>
      <button id="uncBtn" aria-label="Uncouple" aria-pressed="false">UN-<br>COUPLE</button>
    </div>
    <div id="toast"></div>
  </div>
  <div id="panel">
    <div class="row top">
      <div id="speedo"><b id="mph">0.0</b><small>mph</small><span id="dirArrow"></span></div>
      <div class="gauges">
        <div class="gauge"><span>Fuel</span><div class="bar"><i id="fuelBar"></i></div><em id="fuelTxt"></em></div>
        <div class="gauge"><span>Sand</span><div class="bar"><i id="sandBar"></i></div><em id="sandTxt"></em></div>
      </div>
      <div class="seg mode"><button data-mode="drive" id="modeDrive">Drive</button><button data-mode="tap" id="modeTap">Tap</button></div>
      <button id="drawerBtn" aria-label="Show or hide controls">&#9662;</button>
    </div>
    <div id="warn"></div>
    <div id="controls">
      <div id="drive">
        <div class="grp g-rev"><small>Reverser</small>
          <div class="seg rev"><button data-rev="-1" id="revR">R</button><button data-rev="0" id="revN">N</button><button data-rev="1" id="revF">F</button></div></div>
        <div class="grp g-thr"><small>Throttle</small>
          <div class="thr"><button id="thrDn" aria-label="Throttle down">&minus;</button><button id="thrIdle" aria-label="Throttle to idle"><b id="notch">Idle</b></button><button id="thrUp" aria-label="Throttle up">+</button></div></div>
        <div class="grp g-brk"><small>Independent brake</small>
          <div class="seg brk"><button data-brk="0">Off</button><button data-brk="0.25">25</button><button data-brk="0.5">50</button><button data-brk="0.75">75</button><button data-brk="1">Full</button></div></div>
        <div class="grp g-sand"><small>&nbsp;</small><button id="sandBtn" class="act">Sand</button></div>
      </div>
      <div id="tap">
        <p id="tapHint">Tap the track or a car in the picture and the engine goes there. Tap a switch stand to throw it.</p>
        <button id="stopBtn" class="big danger">STOP</button>
      </div>
      <div class="row actions" id="actions">
        <button id="fuelBtn" class="act hide">Fill fuel</button>
        <button id="sandFillBtn" class="act hide">Fill sand</button>
        <button id="truckBtn" class="act hide">Call fuel truck</button>
      </div>
    </div>
  </div>
</div>
<div id="modalBg"><div id="modal"></div></div>
<script>window.NII_BUILD = "mvv8j2ex";</script>
<script>// ---------------------------------------------------------------- NI&I town loader (Oct 30): shared core + one town at a time.
// index.html shows the loading screen, loads core.js (engine + shared art), then the current town's pack from towns/.
// Moving to another town saves, shows the travel screen and reloads the page, so the last town's art is fully released.
(function () {
'use strict';
const TOWNS = { // the one place for town names, packs and rail miles between them
  mattoon: { name: 'Mattoon', pack: 'towns/mattoon.js', south: 'neoga', southMi: 11.5 },
  neoga: { name: 'Neoga', pack: 'towns/neoga.js', north: 'mattoon', northMi: 11.5 },
};
const RUN_MPH = 25;                      // road speed between towns
const KEY = 'nii-towns-v10', OLD_KEY = 'nii-mattoon-test-v9';
const $ = id => document.getElementById(id);
let ENV = null;
function env() {
  if (ENV) return ENV;
  try { ENV = JSON.parse(localStorage.getItem(KEY)); } catch (e) { ENV = null; }
  if (!ENV || ENV.v !== 10) { ENV = { v: 10, town: 'mattoon', towns: {} }; // first run on v10: carry the v9 save over untouched (the v9 key is left in place)
    try { const o = JSON.parse(localStorage.getItem(OLD_KEY)); if (o && o.veh && o.cons) { ENV.towns.mattoon = o; ENV.fromV9 = true; } } catch (e) { } }
  if (!TOWNS[ENV.town]) ENV.town = 'mattoon';
  return ENV;
}
function write() { try { localStorage.setItem(KEY, JSON.stringify(ENV)); } catch (e) { } }
function runInfo(from, to) { const T = TOWNS[from], mi = T.south === to ? T.southMi : T.northMi, sec = Math.round(mi / RUN_MPH * 3600); return { mi, mph: RUN_MPH, sec, min: Math.round(sec / 60) }; }
// ---- loading screen
let prog = 0, progTo = 0, progAnim = null;
function setProg(p, ms) { progTo = p; const p0 = prog, t0 = performance.now(); cancelAnimationFrame(progAnim);
  const step = t => { const k = Math.min(1, (t - t0) / (ms || 1)); prog = p0 + (progTo - p0) * k; const b = $('ldBar'), tr = $('ldTrain'); if (b) b.style.width = (prog * 100).toFixed(1) + '%'; if (tr) tr.style.left = `calc(${(prog * 100).toFixed(1)}% - 34px)`; if (k < 1) progAnim = requestAnimationFrame(step); };
  progAnim = requestAnimationFrame(step); }
function showLoading(title, sub, info) { const L = $('loading'); L.classList.add('show'); $('ldTitle').textContent = title; $('ldSub').textContent = sub || ''; $('ldInfo').textContent = info || ''; }
function hideLoading() { setProg(1, 250); setTimeout(() => $('loading').classList.remove('show'), 320); }
function fail(msg) { $('ldSub').textContent = ''; $('ldInfo').innerHTML = msg; $('loading').classList.add('fail'); }
const travelText = (from, to) => { const r = runInfo(from, to); return `${TOWNS[from].name} to ${TOWNS[to].name}: ${r.mi} mi at ${r.mph} mph, ${r.min} min`; };
function travel(from, to, train) { const e = env(), mt = e.towns.mattoon; e.town = to; e.trainIn = train; e.travel = { from, to };
  if (from === 'mattoon') e.time = mt.time; else e.time = (e.time || mt.time) + runInfo(from, to).sec;
  write(); showLoading(TOWNS[to].name, `NI&I - next stop ${TOWNS[to].name}`, travelText(from, to)); prog = 0; setProg(0.6, 1600);
  setTimeout(() => location.reload(), 1700); }
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src + (window.NII_BUILD ? '?v=' + NII_BUILD : ''); s.onload = ok; s.onerror = () => no(new Error(src)); document.head.appendChild(s); }); }
window.NII = { TOWNS, RUN_MPH, runInfo, env, travel, showLoading, hideLoading,
  loadTown(id) { return env().towns[id] || null; },
  saveTown(id, st) { const e = env(); e.towns[id] = st; if (id === 'mattoon') e.time = st.time; write(); },
  clearSave() { ENV = { v: 10, town: 'mattoon', towns: {} }; write(); }, // Restart: fresh game in every town (the old v9 save is not read again)
  trainDelivered() { const e = env(); delete e.trainIn; delete e.travel; write(); },
  write };
// ---- boot
(function boot() {
  const bg = new Image(); bg.onload = () => { $('loading').style.backgroundImage = `url(${bg.src})`; $('loading').classList.add('pic'); }; bg.src = 'loading/loading-scene.png'; // Danny's picture when it's there; plain screen otherwise
  const e = env(), T = TOWNS[e.town];
  if (e.travel && TOWNS[e.travel.from]) { showLoading(T.name, `NI&I - next stop ${T.name}`, travelText(e.travel.from, e.town)); prog = 0.6; setProg(0.8, 600); }
  else { showLoading(T.name, 'NI&I short line, 1975', 'Loading the railroad…'); setProg(0.5, 900); }
  const t0 = Date.now(), minMs = e.travel ? 900 : 300;
  loadScript('core.js').then(() => { setProg(0.85, 400); return loadScript(T.pack); }).then(() => {
    setTimeout(() => { try { if (e.town === 'mattoon') window.NII_ENGINE(); else window.NII_TOWN_STUB(window.NII); hideLoading(); } catch (err) { fail('The game hit an error while starting: ' + String(err && err.message || err).replace(/</g, '&lt;')); throw err; } }, Math.max(0, minMs - (Date.now() - t0)));
  }).catch(err => fail(`Couldn't load <b>${err.message}</b>.` + (location.protocol === 'file:' ? '<br>Opened as a file: keep core.js and the towns folder next to index.html, or play at <a href="https://stevo3107.github.io/mattoon-game/">stevo3107.github.io/mattoon-game</a>.' : '<br>Check the connection and reload the page.')));
})();
})();
</script>
</body>
</html>
