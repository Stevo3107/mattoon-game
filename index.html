*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b1f27;color:#1d222b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(160px,1fr) auto;grid-template-columns:100%;grid-template-areas:"top" "job" "scene" "panel";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#f3efe6}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#1c2b50;color:#f4f1ea}
.stat{display:flex;flex-direction:column;line-height:1.05;min-width:64px}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}.stat small{font-size:11px;opacity:.75}
.stat b.neg{color:#ff8a7a}
.tb{margin-left:auto;min-width:46px;height:40px;border:0;border-radius:10px;background:#ea7424;color:#fff;font-weight:700;font-size:16px}
#menuBtn{margin-left:0;background:#33467a}
#restartBtn{margin-left:0;background:#33467a;font-size:22px;min-width:42px;padding:0}
#jobbar{grid-area:job;padding:6px 10px;background:#fff8e8;border-bottom:1px solid #d9cfb8;font-size:14px;line-height:1.25}
#jobText b{color:#7a3426}#jobStatus{font-size:12.5px;color:#5a5f68;margin-top:2px}
#jobStatus.ok{color:#17733a;font-weight:700}
#scenewrap{grid-area:scene;position:relative;overflow:hidden;min-height:0;background:#9fb16a}
#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#mapwrap{position:absolute;left:6px;top:6px;width:min(42%,190px);height:74px;overflow:hidden;border-radius:10px;border:2px solid rgba(28,43,80,.7);box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:3;background:#efe9db}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#mapBtns{position:absolute;right:6px;top:6px;display:none;flex-direction:column;gap:6px}
#mapBtns button{width:42px;height:42px;border-radius:10px;border:1px solid #b9b2a2;background:rgba(255,255,255,.92);font-size:20px;font-weight:700;color:#1c2b50}
#mapBtns #mapClose{background:#1c2b50;color:#fff;border-color:#1c2b50}
#mapTitle{display:none;position:absolute;left:58px;right:56px;top:10px;font-size:12px;color:#5a5f68;text-align:center;pointer-events:none}
body.mapopen #mapwrap{left:0;top:0;width:100%;height:100%;border:0;border-radius:0;z-index:6}

<script>// ---------------------------------------------------------------- NI&I town loader (Oct 30): shared core + one town at a time.
// index.html shows the loading screen, loads core.js (engine + shared art), then the current town's pack from towns/.
// Moving to another town saves, shows the travel screen and reloads the page, so the last town's art is fully released.
(function () {
'use strict';
const TOWNS = { // the one place for town names, packs and rail miles between them
  mattoon: { name: 'Mattoon', pack: 'towns/mattoon.js', south: 'neoga', southMi: 11.5 },
  neoga: { name: 'Neoga', pack: 'towns/neoga.js', north: 'mattoon', northMi: 11.5, south: 'effingham', southMi: 18 },
  // Nov 9 review release: Stephen approved publish Nov 8. Isolated save is ?town=effingham&test=rep100 (test=effingham does not isolate).
  effingham: { name: 'Effingham', pack: 'towns/effingham.js', north: 'neoga', northMi: 18 },
};
const RUN_MPH = 25;                      // road speed between towns
// Nov 5 (Stephen): ?test=rep100 plays a separate TEST game (own save slot, never touches the real save): fresh game at 100 rep, Neoga unlocked.
const TEST = /[?&]test=rep100(&|$)/.test(location.search) ? 'rep100' : null;
const KEY = TEST ? 'nii-towns-v10-test' : 'nii-towns-v10', OLD_KEY = TEST ? 'nii-no-v9-for-test' : 'nii-mattoon-test-v9';
// Nov 12 (Stephen): ?test=rep100&fresh=1 wipes ONLY the test save so a new test game starts (and ?spawn=effingham runs again). Never touches the real save.
if (TEST && /[?&]fresh=1(&|$)/.test(location.search)) { try { localStorage.removeItem('nii-towns-v10-test'); const u = new URL(location.href); u.searchParams.delete('fresh'); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (e) { } }
const $ = id => document.getElementById(id);
let ENV = null;
// ---- per-game random seed (Nov 1): every new game / restart gets its own; old saves get one from the next day on (cars already out are untouched)
const newSeed = () => (Math.floor(Math.random() * 0x7fffffff) ^ (Date.now() & 0x7fffffff)) || 1;
function gameSeed(day) { const e = env(); if (!e.seed) { const t = e.towns && e.towns.mattoon ? e.time || e.towns.mattoon.time || 0 : null; e.seed = newSeed(); e.seedFrom = t == null ? 0 : Math.floor(t / 86400) + 2; if (!VISIT) write(); }
  return day >= (e.seedFrom || 0) ? e.seed : 0; }
function shuffleIn(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  b.style.cssText = 'position:fixed;left:8px;bottom:26px;z-index:48;background:rgba(27,42,74,.92);color:#fff;font:600 12px/1.2 sans-serif;padding:5px 6px 5px 10px;border-radius:14px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)';
  b.innerHTML = `<span>Your engine is in ${TOWNS[w].name}</span><button data-en="go" style="font:600 11px sans-serif;padding:3px 8px;border-radius:10px;border:0;background:#f0a030;color:#1b2a4a">Go there</button><button data-en="x" aria-label="Hide" style="font:700 12px sans-serif;padding:2px 7px;border-radius:10px;border:0;background:rgba(255,255,255,.2);color:#fff">×</button>`;
  document.body.appendChild(b); b.addEventListener('click', ev => { const t = ev.target.closest('[data-en]'); if (!t) return; b.remove(); if (t.dataset.en === 'go') goVisit(w); }); }
function visitBanner() { engineNote(); if (!VISIT) return; document.body.classList.add('visit'); const b = document.createElement('div'); b.id = 'visitBar';
  b.innerHTML = `<span>Looking at ${TOWNS[VISIT.town].name}, your train is in ${TOWNS[VISIT.home].name}</span><button data-vb="towns" class="alt">Towns</button><button data-vb="menu" class="alt">Menu</button><button data-vb="back">Back to my train</button>`;
  document.body.appendChild(b); b.addEventListener('click', e => { const t = e.target.closest('[data-vb]'); if (!t) return; if (t.dataset.vb === 'back') backToTrain(); else if (t.dataset.vb === 'menu') sharedMenu(); else pickTown(); }); }
const visitNote = () => `View only. Your train is in ${TOWNS[VISIT.home].name}.`;
// Nov 13 (Stephen): "no way to tuck the menu" on a phone in full screen. A small tab on the left edge hides the top bar, job bar, scene buttons and
// cab panel so the scene fills the screen; tap it again to bring them back. Popups (#modalBg, z 50) sit above it and still show. Remembered for this browser session.
const TUCK_KEY = 'nii-tucked';
function setTuck(on) { document.body.classList.toggle('tucked', !!on); try { sessionStorage.setItem(TUCK_KEY, on ? '1' : '0'); } catch (e) { }
  const t = $('tuckTab'); if (t) { t.textContent = on ? '›' : '‹'; t.setAttribute('aria-label', on ? 'Show the menus' : 'Hide the menus'); t.title = on ? 'Show the menus' : 'Hide the menus'; t.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  setTimeout(() => window.dispatchEvent(new Event('resize')), 30); }
function tuckTab() { if ($('tuckTab')) return;
  const st = document.createElement('style'); st.id = 'tuckCss';
  st.textContent = 'body.tucked #app{grid-template-columns:100%!important;grid-template-rows:1fr!important;grid-template-areas:"scene"!important}'
    + 'body.tucked #top,body.tucked #jobbar,body.tucked #panel,body.tucked #sceneBtns,body.tucked #townTabs{display:none!important}'
    + '#tuckTab{position:fixed;left:env(safe-area-inset-left);top:50%;transform:translateY(-50%);z-index:45;width:20px;height:46px;padding:0;border:1px solid rgba(28,43,80,.35);border-left:0;border-radius:0 10px 10px 0;background:rgba(255,255,255,.72);color:#1c2b50;font:700 18px/1 sans-serif;opacity:.8;box-shadow:0 1px 4px rgba(0,0,0,.2)}'
    + '#tuckTab:active{opacity:1}body.tucked #tuckTab{background:rgba(28,43,80,.75);color:#fff}';
  document.head.appendChild(st);
  const b = document.createElement('button'); b.id = 'tuckTab'; b.type = 'button'; document.body.appendChild(b);
  b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); setTuck(!document.body.classList.contains('tucked')); });
  let on = false; try { on = sessionStorage.getItem(TUCK_KEY) === '1'; } catch (e) { } setTuck(on); }
// ---- boot
(function boot() {
  const bg = new Image(); bg.onload = () => { $('loading').style.backgroundImage = `url(${bg.src})`; $('loading').classList.add('pic'); }; bg.src = 'loading/loading-scene.png'; // Danny's picture when it's there; plain screen otherwise
  if (VISIT) { sessionStorage.removeItem(VKEY); VISIT = null; } // Nov 13: no view-only visits any more (Towns = a full session)
  ENG_SEEN = env().myEngine || null;
  if (VISIT) VISIT.home = env().town;
  const e = env(), TID = VISIT ? VISIT.town : e.town, T = TOWNS[TID];
  if (VISIT) { showLoading(T.name, 'Looking around', `Your train is in ${TOWNS[VISIT.home].name}`); setProg(0.5, 600); }
  else if (e.travel && TOWNS[e.travel.from]) { showLoading(T.name, `NI&I - next stop ${T.name}`, travelText(e.travel.from, e.town)); prog = 0.6; setProg(0.8, 600); }
  else { showLoading(T.name, 'NI&I short line, 1975', 'Loading the railroad…'); setProg(0.5, 900); }
  const t0 = Date.now(), minMs = e.travel ? 900 : 300;
  loadScript('core.js').then(() => { setProg(0.85, 400); return loadScript(T.pack); }).then(() => {
    setTimeout(() => { try { if (TID === 'mattoon') window.NII_ENGINE(); else (window.NII_TOWNS && window.NII_TOWNS[TID] || window.NII_TOWN_STUB)(window.NII); visitBanner(); try { tuckTab(); } catch (e) { } hideLoading(); } catch (err) { fail('The game hit an error while starting: ' + String(err && err.message || err).replace(/</g, '&lt;')); throw err; } }, Math.max(0, minMs - (Date.now() - t0)));
  }).catch(err => fail(`Couldn't load <b>${err.message}</b>.` + (location.protocol === 'file:' ? '<br>Opened as a file: keep core.js and the towns folder next to index.html, or play at <a href="https://stevo3107.github.io/mattoon-game/">stevo3107.github.io/mattoon-game</a>.' : '<br>Check the connection and reload the page.')));
})();
if (TEST) { const mark = () => { if (!document.body) return setTimeout(mark, 200); if (document.getElementById('testMark')) return; // Nov 5 fix: a corner overlay, outside the top bar (it used to push the Menu button off a phone screen)
  const m = document.createElement('div'); m.id = 'testMark'; m.textContent = 'TEST GAME';
  m.style.cssText = 'position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:9999;pointer-events:none;background:rgba(192,57,43,.85);color:#fff;font:700 9px/1 sans-serif;padding:2px 6px;border-radius:4px 4px 0 0;letter-spacing:.5px'; document.body.appendChild(m); }; mark(); }
})();
